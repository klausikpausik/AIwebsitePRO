<!doctype html><html lang="et"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Beat Lab</title><style>body{margin:30px;background:#10110f;color:#eee;font:14px Arial}main{display:grid;grid-template-columns:1fr 260px;gap:25px;max-width:1100px;margin:auto}section,aside{background:#1a1b18;padding:20px;border-radius:12px}h1{font-size:30px}button{cursor:pointer;background:#d3f36b;border:0;border-radius:5px;padding:8px;color:#171910}.row{display:grid;grid-template-columns:100px repeat(16,1fr);gap:5px;padding:8px 0}.step{background:#30312c;padding:0;aspect-ratio:1}.on{background:#d3f36b}.sound{padding:12px;border-bottom:1px solid #333;cursor:grab}.controls{display:flex;gap:20px;align-items:center;padding:16px}.muted{color:#999}</style><h2>♫ beatlab</h2><main><section><p class="muted">RÜTMISTUUDIO · LIVE</p><h1>Pane biit liikuma.</h1><div class="controls"><button id="play">▶ Esita</button><label>Tempo <input id="bpm" type="number" value="120" min="50" max="200"> BPM</label><label>Swing <input id="swing" type="range" min="0" max="60"></label><button id="clear">Puhasta</button></div><div id="grid"></div></section><aside><h2>Helipank</h2><input id="files" type="file" accept="audio/*" multiple><p class="sound" draggable="true" data-kind="kick">🥁 Deep Kick</p><p class="sound" draggable="true" data-kind="snare">🥁 Snare Snap</p><p class="sound" draggable="true" data-kind="hat">✳ Closed Hat</p><p class="sound" draggable="true" data-kind="clap">👏 Soft Clap</p><p class="sound" draggable="true" data-kind="bass">〰 Sub Bass</p><p class="sound" draggable="true" data-kind="pluck">♪ Glass Pluck</p><p class="sound" draggable="true" data-kind="riser">↗ Air Riser</p><p class="muted">Lohista heli rajale. Klõpsa samme rütmi loomiseks.</p></aside></main><script>const names=["Deep Kick","Snare Snap","Closed Hat","Soft Clap"];let pats=[[0,8],[4,12],[0,2,4,6,8,10,12,14],[4,12]],kinds=["kick","snare","hat","clap"],ctx,play=false,pos=0,timer;function draw(){document.querySelector("#grid").innerHTML=names.map((n,r)=>`<div class="row"><b>${n}</b>${Array.from({length:16},(_,i)=>`<button class="step ${pats[r].includes(i)?"on":""}" data-r="${r}" data-i="${i}"></button>`).join("")}</div>`).join("");document.querySelectorAll(".step").forEach(b=>b.onclick=()=>{let p=pats[b.dataset.r],i=+b.dataset.i,j=p.indexOf(i);j<0?p.push(i):p.splice(j,1);b.classList.toggle("on")})}function sound(kind){let C=window.AudioContext||window.webkitAudioContext;if(!ctx)ctx=new C;let t=ctx.currentTime,o=ctx.createGain();o.connect(ctx.destination);if(kind==="kick"){let x=ctx.createOscillator();x.frequency.setValueAtTime(140,t);x.frequency.exponentialRampToValueAtTime(40,t+.18);o.gain.setValueAtTime(.8,t);o.gain.exponentialRampToValueAtTime(.001,t+.4);x.connect(o);x.start(t);x.stop(t+.41)}else{let b=ctx.createBuffer(1,ctx.sampleRate*.2,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;let x=ctx.createBufferSource(),f=ctx.createBiquadFilter();x.buffer=b;f.type="highpass";f.frequency.value=kind==="hat"?6500:900;x.connect(f).connect(o);o.gain.value=.3;x.start(t)}}function tick(){if(!play)return;pats.forEach((p,r)=>{if(p.includes(pos))sound(kinds[r])});pos=(pos+1)%16;timer=setTimeout(tick,60000/(+document.querySelector("#bpm").value||120)/4*(pos%2?1+(+document.querySelector("#swing").value)/100:1))}document.querySelector("#play").onclick=()=>{play=!play;document.querySelector("#play").textContent=play?"■ Peata":"▶ Esita";if(play)tick();else clearTimeout(timer)};document.querySelector("#clear").onclick=()=>{pats=pats.map(()=>[]);draw()};document.querySelectorAll(".sound").forEach(el=>{el.ondragstart=e=>e.dataTransfer.setData("kind",el.dataset.kind);el.ondblclick=()=>sound(el.dataset.kind)});document.querySelector("#grid").ondragover=e=>e.preventDefault();document.querySelector("#grid").ondrop=e=>{e.preventDefault();let k=e.dataTransfer.getData("kind");if(!k)return;let r=kinds.indexOf(k);if(r<0){r=names.length;names.push(elName(k));kinds.push(k);pats.push([0,8]);draw()}};function elName(k){return k[0].toUpperCase()+k.slice(1)}document.querySelector("#files").onchange=async e=>{for(let f of e.target.files){let C=window.AudioContext||window.webkitAudioContext;if(!ctx)ctx=new C;let buf=await ctx.decodeAudioData(await f.arrayBuffer());let b=document.createElement("button");b.textContent="▶ "+f.name;b.onclick=()=>{let s=ctx.createBufferSource();s.buffer=buf;s.connect(ctx.destination);s.start()};document.querySelector("aside").append(b)}};document.addEventListener("keydown",e=>{if(e.code==="Space"&&e.target.tagName!=="INPUT"){e.preventDefault();document.querySelector("#play").click()}});draw();</script></html>
